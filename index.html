<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wwwd</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #000; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 20px 28px;
    z-index: 20;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .nav a { color: #fff; text-decoration: none; opacity: 0.75; }
  .nav a:hover { opacity: 1; }

  /* ---------- one stage: hero is card 0, projects are cards 1..10 ---------- */
  .stage {
    position: relative;
    height: 100svh;
    min-height: 560px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
  }
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  .slide.active { opacity: 1; pointer-events: auto; }

  /* hero card: the text opening, bottom-aligned like the original hero */
  .slide.hero-card { align-items: stretch; justify-content: stretch; }
  .hero-panel {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 28px 8vh;
  }
  .hero-panel h1 {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 600;
    letter-spacing: -0.05em;
    margin: 0;
    font-size: clamp(84px, 17vw, 250px);
    line-height: 0.9;
  }
  .hero-panel h1 .w { display: inline-block; transition: opacity 0.32s ease; }
  .hero-panel h1.typing::after {
    content: "";
    display: inline-block;
    width: 0.055em;
    height: 0.8em;
    background: #fff;
    margin-left: 0.06em;
    vertical-align: -0.02em;
    animation: caretBlink 1s steps(1) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }
  .morph {
    letter-spacing: -0.04em;
    max-width: 680px;
    margin: 24px 0 0 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 2.6vw, 36px);
    line-height: 1.15;
    color: rgba(255,255,255,0.82);
  }
  .morph .line { display: block; margin-bottom: 0.35em; }
  .morph .line .hw { display: inline; opacity: 1; transition: opacity 0.5s cubic-bezier(0.4,0,0.2,1); }

  /* project cards */
  .art {
    --w: 16; --h: 10;
    height: min(72vh, calc(96vw * var(--h) / var(--w)));
    aspect-ratio: var(--w) / var(--h);
    max-width: 96vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .s0 .art { background: linear-gradient(135deg, #3a3733 0%, #211f1d 100%); }
  .s1 .art { background: linear-gradient(135deg, #33383c 0%, #1d2023 100%); }
  .s2 .art { background: linear-gradient(135deg, #3d332a 0%, #241d16 100%); }
  .s3 .art { background: linear-gradient(135deg, #2e3a33 0%, #1a211d 100%); }
  .s4 .art { background: linear-gradient(135deg, #38333a 0%, #201d22 100%); }
  .s5 .art { background: linear-gradient(135deg, #3a3a2e 0%, #22221a 100%); }
  .s6 .art { background: linear-gradient(135deg, #33302e 0%, #1e1c1a 100%); }
  .s7 .art { background: linear-gradient(135deg, #2c3440 0%, #191e26 100%); }
  .s8 .art { background: linear-gradient(135deg, #3c3230 0%, #231d1c 100%); }
  .s9 .art { background: linear-gradient(135deg, #30382e 0%, #1c211b 100%); }
  .art .n {
    font-size: clamp(48px, 7vw, 110px);
    font-weight: 600;
    letter-spacing: -0.03em;
    color: rgba(255,255,255,0.16);
  }
  .zone { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 5; cursor: pointer; }
  .zone.prev { left: 0; }
  .zone.next { right: 0; }

  .caption {
    text-align: center;
    font-size: clamp(14px, 1.4vw, 18px);
    line-height: 1.5;
    padding: 2.5vh 8vw 6vh;
    color: #fff;
    min-height: 12vh;
  }
  .caption .ph { color: #c66; }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html">wwwd</a>
  <a href="bio.html">Bio</a>
</nav>

<div class="stage" id="stage" aria-label="project viewer">
  <!-- card 0: the hero, now inside the deck -->
  <div class="slide hero-card active">
    <div class="hero-panel">
      <h1 id="heroTitle" class="typing">
        <span class="w">w</span>
        <span class="w">w</span>
        <span class="w">w</span>
        <span class="w">d</span>
      </h1>
      <div class="morph" id="morph">
        <span class="line" data-l="0"></span>
        <span class="line" data-l="1"></span>
        <span class="line" data-l="2"></span>
      </div>
    </div>
  </div>
  <!-- cards 1..10: the work -->
  <div class="slide s0"><div class="art" style="--w:16;--h:10"><span class="n">01</span></div></div>
  <div class="slide s1"><div class="art" style="--w:4;--h:5"><span class="n">02</span></div></div>
  <div class="slide s2"><div class="art" style="--w:16;--h:10"><span class="n">03</span></div></div>
  <div class="slide s3"><div class="art" style="--w:4;--h:5"><span class="n">04</span></div></div>
  <div class="slide s4"><div class="art" style="--w:16;--h:10"><span class="n">05</span></div></div>
  <div class="slide s5"><div class="art" style="--w:3;--h:2"><span class="n">06</span></div></div>
  <div class="slide s6"><div class="art" style="--w:4;--h:5"><span class="n">07</span></div></div>
  <div class="slide s7"><div class="art" style="--w:16;--h:10"><span class="n">08</span></div></div>
  <div class="slide s8"><div class="art" style="--w:4;--h:5"><span class="n">09</span></div></div>
  <div class="slide s9"><div class="art" style="--w:16;--h:9"><span class="n">10</span></div></div>
  <div class="zone prev" id="zprev"></div>
  <div class="zone next" id="znext"></div>
</div>
<div class="caption" id="cap"></div>

<script>
  /* ----- hero: "wwwd" unfolds into the title on load; the paragraph states once and stays ----- */
  var statement = [
    "A way of reading what spaces make possible.",
    "Working through architecture, objects, and systems \u2014 tracing behavior, memory, construction, atmosphere, and care.",
    "Where the invisible becomes visible."
  ];
  var lines = Array.prototype.slice.call(document.querySelectorAll("#morph .line"));
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* title intro: wwwd unfolds into What Would We Do (once) */
  var heroTitle = document.getElementById("heroTitle");
  var titleWords = ["What", "Would", "We", "Do"];
  var titleSpans = Array.prototype.slice.call(heroTitle.querySelectorAll(".w"));
  if (reduceMotion) {
    titleSpans.forEach(function(sp, i) { sp.textContent = titleWords[i]; });
    heroTitle.classList.remove("typing");
  } else {
    setTimeout(function() {
      titleSpans.forEach(function(sp, i) {
        setTimeout(function() {
          sp.style.opacity = "0";
          setTimeout(function() {
            sp.textContent = titleWords[i];
            sp.style.opacity = "1";
            if (i === titleSpans.length - 1) heroTitle.classList.remove("typing");
          }, 300);
        }, i * 170);
      });
    }, 1500);
  }

  /* the statement: rendered once, then it stands */
  lines.forEach(function(el, k) { el.textContent = statement[k]; });

  /* ----- one deck: hero card + project cards, circular ----- */
  var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
  var cap = document.getElementById("cap");
  var captions = [
    "",
    "Research seminar, SSA&ndash;CCNY. Fall 2026.",
    "Research seminar <span class='ph'>[review / seminar room]</span>.",
    "Production of glass &mdash; lecture <span class='ph'>[venue]</span>.",
    "Production of glass <span class='ph'>[lecture detail]</span>.",
    "Design-build renovation <span class='ph'>[project, location]</span>.",
    "Design-build renovation <span class='ph'>[interior]</span>.",
    "Design-build renovation <span class='ph'>[detail]</span>.",
    "Architect-to-developer research <span class='ph'>[diagram]</span>.",
    "Staten Island housing study <span class='ph'>[site]</span>.",
    "Staten Island housing study <span class='ph'>[map]</span>."
  ];
  var idx = 0;
  function show(i) {
    idx = (i + slides.length) % slides.length;
    slides.forEach(function(s, k) { s.classList.toggle("active", k === idx); });
    cap.innerHTML = captions[idx];
    /* hero card owns the full viewport: no caption line beneath it */
    cap.style.display = idx === 0 ? "none" : "";
  }
  show(0);

  var stage = document.getElementById("stage");
  var dragged = false;

  document.getElementById("znext").addEventListener("click", function() { if (!dragged) show(idx + 1); });
  document.getElementById("zprev").addEventListener("click", function() { if (!dragged) show(idx - 1); });

  /* scroll over the stage flips through the deck (hero included) */
  var cool = false;
  stage.addEventListener("wheel", function(e) {
    e.preventDefault();
    if (cool) return;
    cool = true;
    show(idx + (e.deltaY > 0 ? 1 : -1));
    setTimeout(function() { cool = false; }, 900);
  }, { passive: false });

  /* drag / swipe */
  var sx = null;
  stage.addEventListener("pointerdown", function(e) { sx = e.clientX; dragged = false; });
  stage.addEventListener("pointermove", function(e) {
    if (sx === null) return;
    if (Math.abs(e.clientX - sx) > 10) dragged = true;
  });
  stage.addEventListener("pointerup", function(e) {
    if (sx === null) return;
    var dx = e.clientX - sx;
    if (Math.abs(dx) > 60) show(idx + (dx < 0 ? 1 : -1));
    sx = null;
    setTimeout(function() { dragged = false; }, 0);
  });
  stage.addEventListener("pointercancel", function() { sx = null; dragged = false; });
</script>
</body>
</html>
